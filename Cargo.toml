[package]
name = "shred-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
futures = "0.3.30"
maplit = "1.0.2"
prost = "0.12"
prost-types = "0.12"
solana-transaction = "=2.2.1"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.10", features = ["tls", "tls-roots", "tls-webpki-roots"] }

[build-dependencies]
protobuf-src = "1"
tonic-build = "0.10"
